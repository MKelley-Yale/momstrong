<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#161513">
<title>MOMstrong Workout</title>
<style>
:root{
  --bg:#161513; --card:#211f1c; --raise:#2a2823; --ink:#e9e6e0; --sub:#9b968e;
  --accent:#4fae97; --accent-soft:#1e332e; --gold:#d9a04f; --gold-soft:#332a1b;
  --line:#35322d; --done:#57534b; --danger:#c25555; --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;}
body{padding-bottom:70px;}
header{padding:10px 14px 4px;display:flex;align-items:baseline;justify-content:space-between;}
header h1{font-size:18px;margin:0;letter-spacing:.3px;}
header .date{color:var(--sub);font-size:12px;}
main{padding:4px 10px 10px;}
.extras{display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:8px;
  font-size:12.5px;color:var(--sub);}
.extras .xitem{display:flex;align-items:center;gap:4px;}
.extras button{width:22px;height:22px;line-height:1;background:var(--raise);color:var(--ink);
  border-radius:6px;font-size:14px;padding:0;}
.extras b{min-width:16px;text-align:center;font-size:13px;color:var(--ink);}
.extras input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0;}
.extras input[type=number]{width:46px;padding:3px 4px;border:1px solid var(--line);
  border-radius:6px;font-size:12px;font-family:inherit;background:var(--raise);color:var(--ink);}
.extras #xsteps{width:64px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative;}
.card.done{opacity:.5;background:#1d1c19;}
.card.done .name{text-decoration:line-through;}
.chk{position:absolute;top:9px;right:10px;width:21px;height:21px;accent-color:var(--accent);}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px;padding-right:30px;}
.chip{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.chip.st{background:#2c2840;color:#b3a7ea;}
.chip.eq{background:var(--raise);color:var(--sub);}
.chip.bs{background:#3a3320;color:#e0bf6a;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
  padding:9px 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--raise);}
.checkline input{width:18px;height:18px;flex:none;}
.checkline b{white-space:nowrap;}
.ftog{display:flex;align-items:center;gap:9px;padding:7px 10px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:10px;background:var(--raise);font-size:13.5px;}
.ftog input[type=checkbox]{width:18px;height:18px;flex:none;}
.ftog b{flex:1;font-weight:600;white-space:nowrap;}
.ftog input[type=number]{width:74px;flex:none;padding:7px 8px;text-align:center;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;}
.ftog span{width:48px;flex:none;font-size:11px;color:var(--sub);}
.ftog.off{opacity:.5;}
.ftog.off input[type=number]{opacity:.45;}
.checkline span{font-weight:400;color:var(--sub);font-size:12px;}
.name{font-size:15px;font-weight:650;margin:1px 0 2px;padding-right:30px;}
.lastline{font-size:12px;color:var(--sub);margin:1px 0;}
.tryline{font-size:12.5px;color:var(--accent);font-weight:600;margin:1px 0 2px;}
.tryline.easier{color:var(--gold);}
.vlink{display:inline-block;font-size:12px;color:var(--accent);text-decoration:none;
  margin:2px 12px 2px 0;font-weight:600;}
details.cues{margin:1px 0 2px;display:inline-block;vertical-align:top;}
details.cues summary{font-size:12px;color:var(--sub);cursor:pointer;}
details.cues ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink);}
details.cues li{margin-bottom:2px;}
details.cues.notesd{display:block;margin-left:8px;}
details.cues.notesd summary{display:inline-block;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
button{font-family:inherit;border:none;border-radius:10px;cursor:pointer;font-size:15px;}
.timer{margin:4px 0 1px;padding:4px 6px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;display:flex;align-items:center;gap:7px;}
.timer select{padding:4px 4px;border:1px solid var(--line);border-radius:7px;font-size:13px;
  font-family:inherit;background:var(--raise);color:var(--ink);}
.timer .tdisp{flex:1;text-align:center;font-size:17px;font-variant-numeric:tabular-nums;
  font-weight:700;letter-spacing:.5px;}
.timer .tdisp.running{color:var(--accent);}
.timer button{padding:5px 11px;background:var(--raise);color:var(--ink);border:1px solid var(--line);font-size:12.5px;}
.notesbox{width:100%;min-height:44px;font-size:12.5px;background:var(--raise);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:6px;font-family:inherit;margin-top:4px;}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;padding:11px 0 9px;background:none;color:var(--sub);font-size:11px;border-radius:0;}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;}
.calhead h3{margin:0;font-size:16px;}
.calhead button{padding:6px 14px;background:var(--raise);color:var(--ink);border:1px solid var(--line);font-size:15px;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.caldow{text-align:center;font-size:10px;color:var(--sub);padding-bottom:2px;}
.calday{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer;min-height:38px;}
.calday.blank{background:transparent;border:none;cursor:default;}
.calday.today2{border:2px solid var(--accent);}
.calday.sel{background:var(--accent-soft);}
.calday .cnt{font-size:10px;font-weight:700;color:#10201b;background:var(--accent);
  border-radius:999px;padding:0 5px;margin-top:1px;line-height:14px;}
.steprow{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;margin-bottom:5px;}
.steprow.today3{border-color:var(--accent);}
.steprow .sd{flex:1;font-size:14px;}
.steprow .sd small{color:var(--sub);}
.steprow input{width:96px;padding:6px;border:1px solid var(--line);border-radius:8px;
  font-size:15px;font-family:inherit;background:var(--raise);color:var(--ink);text-align:right;}
.steptotal{text-align:right;font-size:13px;color:var(--sub);margin:4px 2px;}
.daylog{display:flex;gap:8px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px;}
.daylog .dn{font-weight:600;}
.daylog .dd{color:var(--sub);font-size:12px;}
nav button.active{color:var(--accent);font-weight:700;}
nav button .ico{display:block;font-size:19px;margin-bottom:1px;}
/* modal */
#modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:50;
  align-items:flex-end;justify-content:center;}
#modalwrap.show{display:flex;}
#modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:520px;
  max-height:70vh;overflow-y:auto;padding:12px 14px 18px;position:relative;}
#modal h2{margin:2px 0 8px;font-size:16px;padding-right:38px;}
.mclose{position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:9px;
  background:var(--raise);color:var(--ink);font-size:19px;line-height:1;padding:0;}
.field{margin-bottom:8px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;}
.field input[type=number],.field input[type=text],.field select,.field textarea{
  width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;font-size:16px;
  font-family:inherit;background:var(--raise);color:var(--ink);}
.seg{display:flex;flex-wrap:wrap;gap:5px;}
.seg button{padding:8px 9px;background:var(--raise);color:var(--ink);font-size:13px;flex:1 1 auto;}
.seg button.sel{background:var(--accent);color:#10201b;font-weight:700;}
.seg.diff button{flex:1 1 30%;}
.seg.hold button{flex:1 1 20%;min-width:62px;}
.mrow{display:flex;gap:8px;}
.mrow .field{flex:1;}
.btn-primary{background:var(--accent);color:#10201b;padding:11px 0;width:100%;font-weight:700;font-size:15px;}
.btn-ghost{background:transparent;color:var(--sub);padding:8px 0;width:100%;font-size:14px;margin-top:4px;}
.btn-sm{padding:6px 10px;font-size:13px;background:var(--raise);color:var(--ink);}
.btn-danger{background:var(--danger);color:#fff;}
h3.sec{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin:18px 0 8px;}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;}
.statcard h4{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:600;}
.bignum{font-size:22px;font-weight:700;}
svg.chart{width:100%;height:auto;display:block;}
.librow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.librow .info{flex:1;min-width:0;}
.librow .info .n{font-size:14.5px;font-weight:600;}
.librow .info .d{font-size:12px;color:var(--sub);}
.librow.hidden-mod .info{opacity:.4;}
.librow.region{cursor:pointer;}
.librow.region:active{background:var(--raise);}
.bandrow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px;}
.bandrow .bn{flex:1;font-size:15px;}
.bandrow button{padding:5px 11px;background:var(--raise);color:var(--ink);font-size:14px;}
.note{font-size:12.5px;color:var(--sub);margin:6px 0;}
.empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:14px;}
</style>
</head>
<body>
<header><h1>MOMstrong</h1><div class="date" id="hdrdate"></div></header>
<main id="view"></main>
<nav>
  <button data-tab="today" class="active"><span class="ico">&#9989;</span>Today</button>
  <button data-tab="cal"><span class="ico">&#128197;</span>Calendar</button>
  <button data-tab="steps"><span class="ico">&#128099;</span>Steps</button>
  <button data-tab="stats"><span class="ico">&#128200;</span>Stats</button>
  <button data-tab="library"><span class="ico">&#128218;</span>Library</button>
  <button data-tab="settings"><span class="ico">&#9881;&#65039;</span>Settings</button>
</nav>
<div id="modalwrap"><div id="modal"></div></div>
<script>
"use strict";
/* ===== Muscle groups & module library ===== */
const MUSCLES=[
 {id:"chest",name:"Chest"},{id:"back",name:"Back"},{id:"shoulders",name:"Shoulders"},
 {id:"biceps",name:"Biceps"},{id:"triceps",name:"Triceps"},{id:"core",name:"Core"},
 {id:"glutes",name:"Glutes"},{id:"quads",name:"Quads"},{id:"hams",name:"Hamstrings"},
 {id:"calves",name:"Calves"},{id:"neck",name:"Neck & Upper Back"},
 {id:"hipflex",name:"Hip Flexors"},{id:"groin",name:"Groin (Adductors)"},{id:"itband",name:"IT Band / Outer Hip"},
 {id:"pelvic",name:"Pelvic Floor & Deep Core"},{id:"forearm",name:"Forearms & Wrists"},{id:"ankle",name:"Ankles"}];
const EQ={none:"No equipment",loop:"Loop band",handle:"Handle band",db:"Dumbbell"};
const BUILTIN=[
// CHEST


{id:"ch1",m:"chest",t:"ex",reps:10,sets:2,name:"Push-up",eq:"none",yt:"how to do a push up proper form",
 cues:["Body in one straight line, glutes tight","Hands slightly wider than shoulders","Lower chest to floor, elbows about 45 degrees from body","Drop to knees to make it easier"]},


{id:"ch2",m:"chest",t:"ex",reps:10,sets:2,name:"Dumbbell Floor Press",eq:"db",yt:"dumbbell floor press form",
 cues:["Lie on back, knees bent","Wrists stacked over elbows","Press up over mid-chest, lower until upper arms touch floor","Do not bounce off the floor"]},


{id:"ch3",m:"chest",t:"ex",reps:10,sets:2,name:"Band Chest Press",eq:"handle",yt:"resistance band chest press standing form",
 cues:["Anchor band behind you at chest height","Stagger stance, press handles forward","Keep shoulders down, do not shrug","Slow return - resist the band"]},


{id:"ch4",m:"chest",t:"st",bs:true,hold:30,name:"Doorway Pec Stretch",eq:"none",yt:"doorway pec stretch how to",
 cues:["Forearm on door frame, elbow at 90 degrees","Step gently through the doorway","Feel it across the chest, not in the shoulder joint","Do both sides"]},


{id:"ch5",m:"chest",t:"st",hold:30,name:"Hands-Behind-Back Chest Opener",eq:"none",yt:"standing chest opener stretch hands clasped behind back",
 cues:["Clasp hands behind back, straighten arms","Lift hands away from body slightly","Keep chin tucked, ribs down"]},
// BACK


{id:"bk1",m:"back",t:"ex",reps:10,sets:2,name:"Bent-Over Dumbbell Row",eq:"db",yt:"bent over dumbbell row proper form",
 cues:["Hinge at hips, flat back, chest up","Pull elbow toward hip, squeeze shoulder blade","No torso twisting or jerking","One arm supported on chair works too"]},


{id:"bk2",m:"back",t:"ex",reps:10,sets:2,name:"Band Seated Row",eq:"handle",yt:"seated resistance band row form",
 cues:["Sit tall, legs extended, band around feet","Pull handles to ribs, elbows close","Squeeze shoulder blades together","Do not round the lower back"]},


{id:"bk3",m:"back",t:"ex",hold:30,sets:2,name:"Superman Hold",eq:"none",yt:"superman exercise back proper form",
 cues:["Lie face down, lift arms and legs","Squeeze glutes and upper back","Keep neck neutral - look at floor","Hold 3-5 sec per rep"]},


{id:"bk4",m:"back",t:"st",hold:30,name:"Child's Pose",eq:"none",yt:"childs pose stretch how to",
 cues:["Knees wide, hips back to heels","Arms long, forehead down","Breathe into the ribs and back"]},


{id:"bk5",m:"back",t:"st",hold:30,name:"Cat-Cow",eq:"none",yt:"cat cow stretch proper form",
 cues:["On all fours, move slowly with breath","Round the whole spine up, then arch down","Let the head follow, do not crank the neck"]},
// SHOULDERS


{id:"sh1",m:"shoulders",t:"ex",reps:10,sets:2,name:"Pike Push-up",eq:"none",yt:"pike push up form shoulders",
 cues:["Hips high in an upside-down V","Lower crown of head toward floor between hands","Elbows track back, not flared wide","Elevate feet to make harder"]},


{id:"sh2",m:"shoulders",t:"ex",reps:10,sets:2,name:"Dumbbell Overhead Press",eq:"db",yt:"dumbbell overhead shoulder press standing form",
 cues:["Ribs down, glutes tight - no low-back arch","Press straight up to lockout","Lower with control to shoulder height"]},


{id:"sh3",m:"shoulders",t:"ex",reps:10,sets:2,name:"Band Lateral Raise",eq:"handle",yt:"resistance band lateral raise form",
 cues:["Stand on band, soft elbows","Raise only to shoulder height","Lead with elbows, no shrugging"]},


{id:"sh4",m:"shoulders",t:"st",bs:true,hold:30,name:"Cross-Body Shoulder Stretch",eq:"none",yt:"cross body shoulder stretch how to",
 cues:["Pull arm across chest with other hand","Keep shoulder down away from ear","Gentle pull, both sides"]},


{id:"sh5",m:"shoulders",t:"st",bs:true,hold:30,name:"Thread the Needle",eq:"none",yt:"thread the needle stretch shoulder",
 cues:["From all fours, slide one arm under the other","Rest shoulder and ear on floor","Feel it behind the shoulder and upper back","Both sides"]},
// BICEPS


{id:"bi1",m:"biceps",t:"ex",reps:10,sets:2,name:"Dumbbell Curl",eq:"db",yt:"dumbbell bicep curl proper form",
 cues:["Elbows pinned to sides","No swinging - if you rock, go lighter","Lower all the way down slowly"]},


{id:"bi2",m:"biceps",t:"ex",reps:10,sets:2,name:"Band Curl",eq:"handle",yt:"resistance band bicep curl form",
 cues:["Stand on band, curl handles up","Elbows stay at sides","Resist the band on the way down"]},


{id:"bi3",m:"biceps",t:"ex",hold:15,sets:2,name:"Towel Isometric Curl",eq:"none",yt:"towel isometric bicep curl",
 cues:["Step on a towel, curl and hold against it","Pull hard for 10-20 sec at 90 degrees","Keep wrist straight, breathe"]},


{id:"bi4",m:"biceps",t:"st",bs:true,hold:30,name:"Wall Biceps Stretch",eq:"none",yt:"wall bicep stretch how to",
 cues:["Palm flat on wall behind you, fingers down or back","Slowly turn body away from arm","Mild stretch in front of arm - never force","Both sides"]},


{id:"bi5",m:"biceps",t:"st",hold:30,name:"Arms-Back Clasp Biceps Stretch",eq:"none",yt:"biceps stretch hands clasped behind back palms down",
 cues:["Clasp hands behind back, rotate palms down","Straighten and lift arms slightly","Stand tall, do not lean forward"]},
// TRICEPS


{id:"tr1",m:"triceps",t:"ex",reps:10,sets:2,name:"Chair Dip",eq:"none",yt:"chair tricep dips proper form",
 cues:["Hands on chair edge, fingers forward","Elbows point straight back","Shoulders down - stop if pinching","Bend knees more to make easier"]},


{id:"tr2",m:"triceps",t:"ex",reps:10,sets:2,name:"Dumbbell Overhead Extension",eq:"db",yt:"dumbbell overhead tricep extension form",
 cues:["Hold one dumbbell with both hands overhead","Elbows stay by ears, do not flare","Lower behind head, press back up"]},


{id:"tr3",m:"triceps",t:"ex",reps:10,sets:2,name:"Band Pressdown",eq:"handle",yt:"resistance band tricep pushdown form",
 cues:["Anchor band high (door anchor)","Elbows pinned to sides","Press down to full lockout, slow return"]},


{id:"tr4",m:"triceps",t:"st",bs:true,hold:30,name:"Overhead Triceps Stretch",eq:"none",yt:"overhead tricep stretch how to",
 cues:["Reach one hand down your back, elbow up","Gently assist with other hand","Keep ribs down, no arching","Both sides"]},


{id:"tr5",m:"triceps",t:"st",bs:true,hold:30,name:"Towel Behind-Back Stretch",eq:"none",yt:"towel shoulder tricep stretch behind back",
 cues:["Hold towel behind back, one hand over shoulder, one below","Gently pull up then down","Move slowly, both arrangements"]},
// CORE


{id:"co1",m:"core",t:"ex",reps:10,sets:2,name:"Dead Bug",eq:"none",yt:"dead bug exercise proper form",
 cues:["Low back gently pressed into floor the whole time","Opposite arm and leg lower slowly","Exhale as you extend","Stop when back starts to arch"]},


{id:"co2",m:"core",t:"ex",hold:30,sets:2,name:"Plank",eq:"none",yt:"plank proper form",
 cues:["Straight line ear to ankle","Glutes and quads tight","Do not let hips sag or pike","Knees down to make easier"]},


{id:"co3",m:"core",t:"ex",bs:true,reps:10,sets:2,name:"Band Pallof Press",eq:"handle",yt:"pallof press resistance band form",
 cues:["Anchor band at chest height, stand sideways","Press hands straight out, resist rotation","Ribs down, breathe","Both sides"]},


{id:"co4",m:"core",t:"st",hold:30,name:"Sphinx / Cobra",eq:"none",yt:"sphinx pose cobra stretch how to",
 cues:["Lie face down, prop on forearms (sphinx) or hands (cobra)","Keep hips on floor, glutes relaxed","Only go where back feels comfortable"]},


{id:"co5",m:"core",t:"st",bs:true,hold:30,name:"Standing Side Bend",eq:"none",yt:"standing side bend stretch obliques",
 cues:["Reach one arm overhead, lean sideways","Keep hips level, do not twist","Breathe into the stretched side","Both sides"]},
// GLUTES


{id:"gl1",m:"glutes",t:"ex",reps:10,sets:2,name:"Glute Bridge",eq:"none",yt:"glute bridge proper form",
 cues:["Feet hip-width, heels near butt","Squeeze glutes to lift - not lower back","Ribs down at top, do not overarch","Pause 2 sec at top"]},


{id:"gl2",m:"glutes",t:"ex",reps:10,sets:2,name:"Banded Lateral Walk",eq:"loop",yt:"banded lateral walk glutes form",
 cues:["Band above knees or ankles","Quarter squat, stay low the whole time","Small controlled steps, knees pushed out"]},


{id:"gl3",m:"glutes",t:"ex",reps:10,sets:2,name:"Single-Leg Glute Bridge",eq:"none",yt:"single leg glute bridge form",
 cues:["One foot down, other leg extended","Keep hips level - do not let one side drop","Push through the heel"]},


{id:"gl4",m:"glutes",t:"st",bs:true,hold:30,name:"Figure-4 Stretch",eq:"none",yt:"figure 4 glute stretch lying",
 cues:["On back, ankle over opposite knee","Pull the bottom thigh toward chest","Keep head and shoulders down","Both sides"]},


{id:"gl5",m:"glutes",t:"st",bs:true,hold:30,name:"Pigeon Stretch",eq:"none",yt:"pigeon pose stretch how to",
 cues:["Front shin angled, back leg long","Square hips forward","Fold forward only as far as comfortable","Both sides"]},
// QUADS


{id:"qu1",m:"quads",t:"ex",reps:10,sets:2,name:"Bodyweight Squat",eq:"none",yt:"bodyweight squat proper form",
 cues:["Feet shoulder-width, toes slightly out","Knees track over toes","Chest tall, weight in whole foot","Depth: comfortable and pain-free"]},


{id:"qu2",m:"quads",t:"ex",reps:10,sets:2,name:"Goblet Squat",eq:"db",yt:"goblet squat dumbbell form",
 cues:["Hold dumbbell at chest, elbows down","Elbows track inside knees at bottom","Heels stay down, chest up"]},


{id:"qu3",m:"quads",t:"ex",reps:10,sets:2,name:"Split Squat",eq:"none",yt:"split squat proper form",
 cues:["Long stance, front heel planted","Drop back knee straight down","Front knee tracks over toes","Hold dumbbells to progress"]},


{id:"qu4",m:"quads",t:"st",bs:true,hold:30,name:"Standing Quad Stretch",eq:"none",yt:"standing quad stretch how to",
 cues:["Pull heel to butt, knees together","Tuck pelvis under - do not arch back","Hold wall for balance","Both sides"]},


{id:"qu5",m:"quads",t:"st",bs:true,hold:30,name:"Kneeling Quad / Couch Stretch",eq:"none",yt:"couch stretch quad hip flexor how to",
 cues:["Back foot elevated on couch or wall, knee on pad","Squeeze glute of back leg, pelvis tucked","Upright torso increases stretch","Both sides"]},
// HAMSTRINGS


{id:"ha1",m:"hams",t:"ex",reps:10,sets:2,name:"Dumbbell Romanian Deadlift",eq:"db",yt:"dumbbell romanian deadlift proper form",

/* ===== Utils ===== */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function todayStr(d){d=d||new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function niceDate(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});}
function shortDate(s){const[y,m,d]=s.split("-").map(Number);return (m)+"/"+d;}
function daysBetween(a,b){const[y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5);}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtHold(sec){const m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}
function ytUrl(q){return "https://www.youtube.com/results?search_query="+encodeURIComponent(q);}

/* ===== State ===== */
const KEY="momstrong_v1";
const DEFAULT_BANDS=["yellow","orange","red","green","light green","medium green","dark green","blue","purple"];
let S;
function freshState(){return {logs:[],days:{},extras:{},notes:{},settings:{bandOrder:DEFAULT_BANDS.slice(),bandOrderSet:false},lib:{custom:[],hidden:[],edits:{}}};}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const s=JSON.parse(r);
 s.logs=s.logs||[];s.days=s.days||{};s.extras=s.extras||{};s.notes=s.notes||{};s.settings=s.settings||{};
 s.settings.bandOrder=s.settings.bandOrder||DEFAULT_BANDS.slice();
 s.settings.bandOrderSet=!!s.settings.bandOrderSet;
 s.lib=s.lib||{};s.lib.custom=s.lib.custom||[];s.lib.hidden=s.lib.hidden||[];s.lib.edits=s.lib.edits||{};
 return s;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert("Could not save data: "+e.message);}}
S=load()||freshState();

/* library with edits/custom/hidden applied */
function getLib(includeHidden){
 const out=[];
 for(const b of BUILTIN){const e=S.lib.edits[b.id];const mod=e?Object.assign({},b,e):b;
  if(!includeHidden&&S.lib.hidden.includes(mod.id))continue;out.push(mod);}
 for(const c of S.lib.custom){if(!includeHidden&&S.lib.hidden.includes(c.id))continue;out.push(c);}
 return out;}
function getMod(id){const c=S.lib.custom.find(x=>x.id===id);if(c)return c;
 const b=BUILTIN.find(x=>x.id===id);if(!b)return null;
 const e=S.lib.edits[id];return e?Object.assign({},b,e):b;}

/* ===== History helpers ===== */
function logsFor(modId){return S.logs.filter(l=>l.mod===modId).sort((a,b)=>a.ts-b.ts);}
function lastLogFor(modId){const ls=logsFor(modId);return ls.length?ls[ls.length-1]:null;}
function lastDate(pred){let best=null;for(const l of S.logs){if(pred(l)&&(!best||l.date>best))best=l.date;}return best;}
function daysSince(dateStr,ref){return dateStr==null?Infinity:daysBetween(dateStr,ref);}

/* ===== Daily selection =====
   - 1 item per muscle: exercise or stretch
   - weighted toward whichever (stretch or exercise) that muscle has gone longer
     without, using days-since-last-done as the weight (capped so "never done"
     doesn't dominate outright) - not a hard 50/50 or threshold-triggered split
   - muscles not checked off (any item) in 3+ days float to the top tier
   - deterministic per date, frozen once generated */
const STALE_CAP_DAYS=21;
function ensureDay(date){
 if(S.days[date]&&S.days[date].items&&S.days[date].items.length)return S.days[date];
 const rng=mulberry32(hashStr(date+"|momstrong"));
 const lib=getLib(false);
 const picks=[],meta=[];
 for(const mu of MUSCLES){
  const exs=lib.filter(x=>x.m===mu.id&&x.t==="ex");
  const sts=lib.filter(x=>x.m===mu.id&&x.t==="st");
  if(!exs.length&&!sts.length)continue;
  let type,stStale=false;
  if(!exs.length)type="st";else if(!sts.length)type="ex";
  else{
   const dSt=Math.min(daysSince(lastDate(l=>l.m===mu.id&&l.t==="st"),date),STALE_CAP_DAYS);
   const dEx=Math.min(daysSince(lastDate(l=>l.m===mu.id&&l.t==="ex"),date),STALE_CAP_DAYS);
   stStale=dSt>=5;
   const wSt=dSt+1,wEx=dEx+1;
   type=rng()<(wSt/(wSt+wEx))?"st":"ex";
  }
  const pool=type==="st"?sts:exs;
  const mod=pool[Math.floor(rng()*pool.length)];
  picks.push({mod:mod.id,m:mu.id,t:type,done:false,logId:null});
  meta.push({exs:exs,stale:stStale});
 }
 /* strengthening floor: at least a quarter of the day's items must be exercises.
    Convert stretch picks to exercises, muscles with a fresh stretch first so the
    5-day stretch-staleness rule is the last thing given up. */
 const quota=Math.ceil(picks.length/4);
 let exCount=picks.filter(p=>p.t==="ex").length;
 if(exCount<quota){
  const swappable=picks.map((p,i)=>i).filter(i=>picks[i].t==="st"&&meta[i].exs.length);
  const order=shuffle(swappable.filter(i=>!meta[i].stale),rng)
        .concat(shuffle(swappable.filter(i=>meta[i].stale),rng));
  for(const i of order){
   if(exCount>=quota)break;
   const pool=meta[i].exs;
   picks[i].mod=pool[Math.floor(rng()*pool.length)].id;
   picks[i].t="ex";
   exCount++;
  }
 }
 const overdue=[],recent=[];
 for(const p of picks){
  (daysSince(lastDate(l=>l.m===p.m),date)>=3?overdue:recent).push(p);
 }
 const items=shuffle(overdue,rng).concat(shuffle(recent,rng));
 S.days[date]={items:items};
 save();
 return S.days[date];
}
function rerollToday(){const d=todayStr();delete S.days[d];save();ensureDay(d);render();}

/* ===== Suggestion engine =====
   exercise diff: wte, se, jr, sh, wth
   stretch  diff: mild, strong, pain */
const EXDIFF=[["wte","Way too easy"],["se","Somewhat easy"],["jr","Just right"],["sh","Somewhat hard"],["wth","Way too hard"]];
const STDIFF=[["mild","Mild stretch"],["strong","Strong but comfortable"],["pain","Painful"]];
const HOLDS=[15,30,45,60,75,90,105,120];
/* double progression: a module's saved reps count is the BOTTOM of its working
   range; REP_RANGE_SPAN above that is the top. Climb reps within the range on
   easy sessions; only once the top is reached does weight/band/sets move, and
   reps reset to the bottom - so load only ever increases once it's earned. */
const REP_RANGE_SPAN=5;
const MAX_SETS=5;
function diffLabel(code){const all=EXDIFF.concat(STDIFF);const f=all.find(x=>x[0]===code);return f?f[1]:"";}
/* unilateral modules: numbers logged are per side */
const PERSIDE=" / side";
function sideSuffix(x){return(x&&x.bs)?PERSIDE:"";}
function nextBand(color,dir){
 const ord=S.settings.bandOrder;const i=ord.indexOf(color);
 if(!S.settings.bandOrderSet||i<0)return null;
 const j=i+dir;return(j>=0&&j<ord.length)?ord[j]:null;}
/* hold choices for a module = the standard ladder plus its own default */
function holdList(mod){
 const L=HOLDS.slice();
 if(mod&&mod.hold&&L.indexOf(mod.hold)<0)L.push(mod.hold);
 return L.sort((a,b)=>a-b);}
function stepHold(sec,dir,list){
 const L=(list&&list.length)?list:HOLDS;
 let i=L.indexOf(sec);if(i<0){i=L.findIndex(h=>h>=sec);if(i<0)i=L.length-1;}
 const j=Math.min(Math.max(i+dir,0),L.length-1);return L[j];}

/* Which of hold / reps / sets this module tracks. A field is "on" when it has a
   saved value; a module with nothing saved falls back to the old defaults so
   pre-existing custom modules keep working. Sets is a standard item for every
   exercise - always on, not user-toggleable; hold time and reps stay optional. */
const FIELD_DEFAULTS={hold:30,reps:10,sets:2};
function fields(mod){
 if(!mod)return{hold:false,reps:false,sets:false};
 if(mod.t==="ex"){
  if(mod.hold!=null||mod.reps!=null||mod.sets!=null)
   return{hold:mod.hold!=null,reps:mod.reps!=null,sets:true};
  return{hold:false,reps:true,sets:true};
 }
 if(mod.hold!=null||mod.reps!=null||mod.sets!=null)
  return{hold:mod.hold!=null,reps:mod.reps!=null,sets:mod.sets!=null};
 return{hold:true,reps:false,sets:false};}

function suggest(mod){
 const last=lastLogFor(mod.id);
 const sug={weight:null,reps:null,sets:null,band:null,hold:null,note:"",dir:0,last:last};
 const F=fields(mod),HL=holdList(mod);
 if(F.hold)sug.hold=(last&&last.hold)||mod.hold||FIELD_DEFAULTS.hold;
 if(F.reps)sug.reps=(last&&last.reps)||mod.reps||FIELD_DEFAULTS.reps;
 if(F.sets)sug.sets=(last&&last.sets)||mod.sets||FIELD_DEFAULTS.sets;
 if(mod.t==="st"){
  if(last&&F.hold){
   if(last.diff==="mild"){const h=stepHold(sug.hold,1,HL);if(h>sug.hold){sug.hold=h;sug.note="was mild last time - longer hold";}else{sug.note="was mild - deepen the stretch";}sug.dir=1;}
   else if(last.diff==="pain"){sug.hold=stepHold(sug.hold,-1,HL);sug.note="was painful last time - ease off";sug.dir=-1;}
  }else if(last){
   if(last.diff==="mild"){sug.note="was mild - deepen the stretch";sug.dir=1;}
   else if(last.diff==="pain"){sug.note="was painful last time - ease off";sug.dir=-1;}
  }
  return sug;
 }
 // exercise
 if(mod.eq==="db")sug.weight=last&&last.weight?last.weight:null;
 if(mod.eq==="loop"||mod.eq==="handle")sug.band=last&&last.band?last.band:null;
 if(!last)return sug;
 const easy=last.diff==="wte"||last.diff==="se",hard=last.diff==="wth";
 if(!easy&&!hard)return sug; // just right / somewhat hard - hold steady, no change
 sug.dir=easy?1:-1;
 if(F.reps){
  /* double progression: climb reps within [lo,hi] on easy sessions; only after
     reaching hi does the load lever (weight/band/sets) move, resetting reps to
     lo. Symmetrically, only after dropping to lo does a hard session ease the
     load lever instead of pushing reps below it. */
  const lo=mod.reps||FIELD_DEFAULTS.reps,hi=lo+REP_RANGE_SPAN;
  const cur=sug.reps;
  if(easy){
   if(cur<hi){
    sug.reps=Math.min(cur+(last.diff==="wte"?3:2),hi);
    sug.note="was easy - up to "+sug.reps+" reps (aiming for "+hi+" before the next step up)";
   }else{
    sug.reps=lo;
    if(mod.eq==="db"&&last.weight){
     sug.weight=last.weight+2.5;
     sug.note="hit "+hi+" reps - weight up to "+sug.weight+" lb, back to "+lo+" reps";
    }else if((mod.eq==="loop"||mod.eq==="handle")&&last.band){
     const nb=nextBand(last.band,1);
     if(nb){sug.band=nb;sug.note="hit "+hi+" reps - next band up, back to "+lo+" reps";}
     else if(F.sets&&(sug.sets||FIELD_DEFAULTS.sets)<MAX_SETS){
      sug.sets=(sug.sets||FIELD_DEFAULTS.sets)+1;
      sug.note=S.settings.bandOrderSet?"hit "+hi+" reps, top band - add a set instead, back to "+lo+" reps"
                                       :"hit "+hi+" reps, top band - add a set (set band order in Settings for band suggestions), back to "+lo+" reps";
     }else{sug.reps=hi;sug.note="hit "+hi+" reps - top band already, hold here";}
    }else if(F.sets&&(sug.sets||FIELD_DEFAULTS.sets)<MAX_SETS){
     sug.sets=(sug.sets||FIELD_DEFAULTS.sets)+1;
     sug.note="hit "+hi+" reps - add a set, back to "+lo+" reps";
    }else{sug.reps=hi;sug.note="hit "+hi+" reps - hold here, great work";}
   }
  }else{
   if(cur>lo){
    sug.reps=Math.max(cur-2,lo);
    sug.note="was too hard - back to "+sug.reps+" reps";
   }else if(mod.eq==="db"&&last.weight){
    sug.weight=Math.max(last.weight-2.5,0);
    sug.note="too hard even at "+lo+" reps - weight down to "+sug.weight+" lb";
   }else if((mod.eq==="loop"||mod.eq==="handle")&&last.band){
    const pb=nextBand(last.band,-1);
    if(pb){sug.band=pb;sug.note="too hard even at "+lo+" reps - band down";}
    else sug.note="too hard even at "+lo+" reps - lightest band already";
   }else if(F.sets&&(sug.sets||FIELD_DEFAULTS.sets)>1){
    sug.sets=Math.max((sug.sets||FIELD_DEFAULTS.sets)-1,1);
    sug.note="too hard even at "+lo+" reps - drop a set";
   }else{
    sug.note="too hard even at "+lo+" reps - consider an easier variation";
   }
  }
  return sug;
 }
 /* isometric hold-only exercises (no reps tracked): step the hold ladder, then sets */
 if(F.hold){
  const h=stepHold(sug.hold,sug.dir,HL);
  if(h!==sug.hold){sug.hold=h;sug.note=easy?"was easy - longer hold":"was too hard - shorter hold";return sug;}
  if(easy&&F.sets){sug.sets=(sug.sets||FIELD_DEFAULTS.sets)+1;sug.note="was easy - add a set";return sug;}
  sug.note=easy?"was easy - hold here":"was too hard - ease off";return sug;
 }
 if(F.sets){
  sug.sets=Math.max((sug.sets||FIELD_DEFAULTS.sets)+(easy?1:-1),1);
  sug.note=easy?"was easy - add a set":"was too hard - drop a set";return sug;
 }
 sug.note=easy?"was easy - hold here":"was too hard - ease off";
 return sug;
}
function lastLine(mod){
 const l=lastLogFor(mod.id);if(!l)return "First time - no history yet";
 const bits=[];
 if(l.weight)bits.push(l.weight+" lb");
 if(l.band)bits.push(l.band+" band");
 if(l.reps)bits.push(l.reps+" reps"+(l.sets?" x "+l.sets:""));
 if(l.hold)bits.push(fmtHold(l.hold)+" hold");
 let s="Last ("+shortDate(l.date)+"): "+(bits.length?bits.join(", ")+sideSuffix(l.bs?l:mod):"done");
 if(l.diff)s+=" - "+diffLabel(l.diff).toLowerCase();
 return s;}
function tryLine(mod,sug){
 const bits=[];
 if(sug.weight)bits.push(sug.weight+" lb");
 if(sug.band)bits.push(sug.band+" band");
 if(sug.reps)bits.push(sug.reps+" reps"+(sug.sets?" x "+sug.sets:""));

/* ===== Timer (one active at a time) ===== */
let timerInt=null,timerLeft=0,timerEl=null,timerDur=30;
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
 o.frequency.value=880;g.gain.setValueAtTime(0.4,ctx.currentTime);
 o.start();o.stop(ctx.currentTime+0.6);
 g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);}catch(e){}}
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}
 if(timerEl){const d=timerEl.querySelector(".tdisp");if(d)d.classList.remove("running");}}
function tickTimer(){
 timerLeft--;
 const d=timerEl&&timerEl.querySelector(".tdisp");
 if(d)d.textContent=fmtHold(Math.max(timerLeft,0));
 if(timerLeft<=0){stopTimer();beep();if(d)d.textContent="Done!";
  if(navigator.vibrate)navigator.vibrate([200,100,200]);}}
function wireTodayEvents(date){
 const day=S.days[date];
 $("#view").querySelectorAll("[data-chk]").forEach(cb=>cb.onchange=()=>{
  const id=cb.getAttribute("data-chk");
  const it=day&&day.items.find(x=>x.mod===id);
  if(!it)return;
  if(cb.checked&&!it.done)openLog(date,id);
  else if(!cb.checked&&it.done)undoDone(date,id);
 });
 $("#view").querySelectorAll("[data-note]").forEach(t=>t.onchange=()=>{
  const v=t.value.trim();
  if(v)S.notes[t.getAttribute("data-note")]=v;
  else delete S.notes[t.getAttribute("data-note")];
  save();
 });
 $("#view").querySelectorAll(".timer").forEach(t=>{
  const disp=t.querySelector(".tdisp");
  const sel=t.querySelector("[data-tsel]");
  timerDur=parseInt(sel.value);
  sel.onchange=()=>{
   stopTimer();timerEl=t;timerDur=parseInt(sel.value);timerLeft=timerDur;
   disp.textContent=fmtHold(timerLeft);};
  t.querySelector("[data-tstart]").onclick=()=>{
   if(timerInt&&timerEl===t){stopTimer();return;}  // pause
   stopTimer();timerEl=t;timerDur=parseInt(sel.value);
   if(timerLeft<=0||disp.textContent==="Done!")timerLeft=timerDur;
   disp.classList.add("running");disp.textContent=fmtHold(timerLeft);
   timerInt=setInterval(tickTimer,1000);};
  t.querySelector("[data-treset]").onclick=()=>{
   stopTimer();timerEl=t;timerDur=parseInt(sel.value);
   timerLeft=timerDur;disp.textContent=fmtHold(timerLeft);};
 });
}

let STATS_M="chest";
function lineChart(pts,unit,fmt){
 // pts: [{date,y}] sorted
 if(pts.length<2)return '<div class="note">Need 2+ logged sessions to draw a chart.</div>';
 fmt=fmt||(v=>v);
 const W=320,H=140,P=28;
 let ymin=Math.min(...pts.map(p=>p.y)),ymax=Math.max(...pts.map(p=>p.y));
 if(ymin===ymax){ymin-=1;ymax+=1;}
 const pad=(ymax-ymin)*0.12;ymin-=pad;ymax+=pad;
 const X=i=>P+ i*(W-P-8)/(pts.length-1);
 const Y=v=>H-P+ (v-ymin)*(P+14-H)/(ymax-ymin);
 let path="";
 pts.forEach((p,i)=>{path+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)+" ";});
 let dots="";
 pts.forEach((p,i)=>{dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5" fill="#4fae97"/>';});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+
  '<line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-8)+'" y2="'+(H-P)+'" stroke="#35322d"/>'+
  '<text x="'+(P-4)+'" y="'+(Y(ymax-pad)+4)+'" font-size="10" fill="#9b968e" text-anchor="end">'+fmt(Math.round((ymax-pad)*10)/10)+'</text>'+
  '<text x="'+(P-4)+'" y="'+(Y(ymin+pad)+4)+'" font-size="10" fill="#9b968e" text-anchor="end">'+fmt(Math.round((ymin+pad)*10)/10)+'</text>'+
  '<path d="'+path+'" fill="none" stroke="#4fae97" stroke-width="2"/>'+dots+
  '<text x="'+P+'" y="'+(H-8)+'" font-size="10" fill="#9b968e">'+shortDate(pts[0].date)+'</text>'+
  '<text x="'+(W-8)+'" y="'+(H-8)+'" font-size="10" fill="#9b968e" text-anchor="end">'+shortDate(pts[pts.length-1].date)+'</text>'+
  '<text x="'+(W-8)+'" y="14" font-size="10" fill="#9b968e" text-anchor="end">'+esc(unit)+'</text></svg>';
}
function weekChart(muscle){

 const now=new Date();const day=(now.getDay()+6)%7; // 0=Mon

 const weeks=[];
 for(let w=7;w>=0;w--){
  const start=new Date(thisMon);start.setDate(start.getDate()-7*w);
  const end=new Date(start);end.setDate(end.getDate()+6);
  const s=todayStr(start),e=todayStr(end);
  const days=new Set(S.logs.filter(l=>l.m===muscle&&l.date>=s&&l.date<=e).map(l=>l.date));
  weeks.push({label:shortDate(s),n:days.size});
 }
 const W=320,H=110,P=24,bw=(W-P-10)/8;
 let bars="",labs="";
 weeks.forEach((wk,i)=>{
  const h=wk.n/7*(H-P-18);
  const x=P+i*bw+3,y=H-P-h;
  bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-6).toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3" fill="'+(wk.n?"#4fae97":"#35322d")+'"/>';
  if(wk.n)bars+='<text x="'+(x+(bw-6)/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" font-size="9" fill="#e9e6e0" text-anchor="middle">'+wk.n+'</text>';
  labs+='<text x="'+(x+(bw-6)/2).toFixed(1)+'" y="'+(H-P+11)+'" font-size="8" fill="#9b968e" text-anchor="middle">'+wk.label+'</text>';
 });
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-8)+'" y2="'+(H-P)+'" stroke="#35322d"/>'+bars+labs+'</svg>';
}

 const logs=S.logs.filter(l=>l.m===STATS_M).sort((a,b)=>a.ts-b.ts);
 const last=logs.length?logs[logs.length-1].date:null;
 const days=new Set(logs.map(l=>l.date)).size;
 h+='<div class="statcard"><div class="row" style="justify-content:space-between">';
 h+='<div><h4>Total days</h4><div class="bignum">'+days+'</div></div>';
 h+='<div><h4>Total check-offs</h4><div class="bignum">'+logs.length+'</div></div>';
 h+='<div><h4>Last done</h4><div class="bignum" style="font-size:15px">'+(last?niceDate(last):"never")+'</div></div>';
 h+='</div></div>';
 h+='<div class="statcard"><h4>Days targeted per week (last 8 weeks)</h4>'+weekChart(STATS_M)+'</div>';
 const wpts=logs.filter(l=>l.weight!=null).map(l=>({date:l.date,y:l.weight}));
 h+='<div class="statcard"><h4>Weight over time</h4>'+lineChart(wpts,"lb")+'</div>';
 const rpts=logs.filter(l=>l.reps!=null).map(l=>({date:l.date,y:l.reps}));
 h+='<div class="statcard"><h4>Reps over time</h4>'+lineChart(rpts,"reps")+'</div>';
 const hpts=logs.filter(l=>l.hold!=null).map(l=>({date:l.date,y:l.hold}));
 h+='<div class="statcard"><h4>Stretch hold over time</h4>'+lineChart(hpts,"sec")+'</div>';
 const bl=logs.filter(l=>l.band).slice(-1)[0];
 if(bl)h+='<div class="note">Most recent band: '+esc(bl.band)+' ('+shortDate(bl.date)+')</div>';
 $("#view").innerHTML=h;
 $("#statsel").onchange=e=>{STATS_M=e.target.value;renderStats();};
}

/* ===== Library ===== */
/* "3 x 10 reps, 0:30 hold" from a module's saved targets; "" if none set */
function targetLabel(mod){
 const b=[];
 if(mod.reps)b.push((mod.sets?mod.sets+" x ":"")+mod.reps+" reps");
 else if(mod.sets)b.push(mod.sets+" sets");
 if(mod.hold)b.push(fmtHold(mod.hold)+" hold");
 return b.join(", ")+(b.length?sideSuffix(mod):"");}
let LIB_M=null; /* null = region menu; else the selected muscle id */
function renderLibrary(){
 if(!LIB_M){renderLibraryMenu();return;}
 if(!MUSCLES.some(m=>m.id===LIB_M)){LIB_M=null;renderLibraryMenu();return;}
 renderLibraryRegion(LIB_M);
}
function renderLibraryMenu(){
 let h='<div class="note">Tap a body region to see and edit its exercises and stretches.</div>';
 for(const mu of MUSCLES){
  const mods=getLib(true).filter(x=>x.m===mu.id);
  const hidCount=mods.filter(x=>S.lib.hidden.includes(x.id)).length;
  h+='<div class="librow region" data-region="'+mu.id+'"><div class="info"><div class="n">'+esc(mu.name)+'</div>';
  h+='<div class="d">'+mods.length+' module'+(mods.length===1?"":"s")+(hidCount?" &middot; "+hidCount+" hidden":"")+'</div></div>';
  h+='<span aria-hidden="true" style="color:var(--sub);font-size:19px">&#8250;</span></div>';
 }
 $("#view").innerHTML=h;
 $("#view").querySelectorAll("[data-region]").forEach(row=>row.onclick=()=>{
  LIB_M=row.getAttribute("data-region");render();window.scrollTo(0,0);});
}
function renderLibraryRegion(muId){
 const mu=MUSCLES.find(x=>x.id===muId);
 let h='<button class="btn-sm" id="lib-back">&larr; All regions</button>';
 h+='<h3 class="sec">'+esc(mu?mu.name:"")+'</h3>';
 const mods=getLib(true).filter(x=>x.m===muId);
 for(const mod of mods){
  const hid=S.lib.hidden.includes(mod.id);
  h+='<div class="librow'+(hid?" hidden-mod":"")+'">';
  h+='<div class="info" data-edit="'+esc(mod.id)+'"><div class="n">'+esc(mod.name)+'</div>';
  let dbits=[(mod.t==="st"?"Stretch":"Exercise"),esc(EQ[mod.eq]||mod.eq)];
  if(mod.bs)dbits.push("Both sides");
  const tgt=targetLabel(mod);if(tgt)dbits.push(tgt);
  h+='<div class="d">'+dbits.join(" &middot; ")+'</div></div>';
  h+='<button class="btn-sm" data-hide="'+esc(mod.id)+'">'+(hid?"Unhide":"Hide")+'</button></div>';
 }
 h+='<button class="btn-sm" style="margin-top:6px" data-add="'+muId+'">+ Add to '+esc(mu?mu.name:"")+'</button>';
 $("#view").innerHTML=h;
 $("#lib-back").onclick=()=>{LIB_M=null;render();window.scrollTo(0,0);};
 $("#view").querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>{
  const id=b.getAttribute("data-hide");
  const i=S.lib.hidden.indexOf(id);
  if(i>=0)S.lib.hidden.splice(i,1);else S.lib.hidden.push(id);
  save();renderLibrary();});
 $("#view").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openModEditor(b.getAttribute("data-edit"),null));
 $("#view").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openModEditor(null,b.getAttribute("data-add")));
}
function openModEditor(id,muscle){
 const mod=id?getMod(id):{id:null,m:muscle,t:"ex",eq:"none",name:"",cues:[],yt:""};
 let h='<h2>'+(id?"Edit module":"New module")+'</h2>';
 h+='<div class="field"><label>Name</label><input type="text" id="e_name" value="'+esc(mod.name)+'"></div>';
 h+='<div class="mrow"><div class="field"><label>Type</label><select id="e_type"><option value="ex"'+(mod.t==="ex"?" selected":"")+'>Exercise</option><option value="st"'+(mod.t==="st"?" selected":"")+'>Stretch</option></select></div>';
 h+='<div class="field"><label>Equipment</label><select id="e_eq">';
 for(const k in EQ)h+='<option value="'+k+'"'+(mod.eq===k?" selected":"")+'>'+EQ[k]+'</option>';
 h+='</select></div></div>';
 h+='<div class="field"><label>Muscle</label><select id="e_m">';
 for(const mu of MUSCLES)h+='<option value="'+mu.id+'"'+(mod.m===mu.id?" selected":"")+'>'+esc(mu.name)+'</option>';
 h+='</select></div>';
 const F0=fields(mod);
 const fieldRow=(key,label,unit)=>{
  const on=F0[key],val=(mod[key]!=null&&mod[key]!=="")?mod[key]:FIELD_DEFAULTS[key];
  return '<label class="ftog'+(on?"":" off")+'" data-ftog="'+key+'">'
   +'<input type="checkbox" data-fchk="'+key+'" id="e_'+key+'_on"'+(on?" checked":"")+'>'
   +'<b>'+label+'</b>'
   +'<input type="number" inputmode="numeric" min="1" id="e_'+key+'" value="'+val+'"'+(on?"":" disabled")+'>'
   +'<span>'+unit+'</span></label>';};
 const fixedRow=(key,label,unit)=>{
  const val=(mod[key]!=null&&mod[key]!=="")?mod[key]:FIELD_DEFAULTS[key];
  return '<label class="ftog" data-ftog="'+key+'">'
   +'<b>'+label+'</b>'
   +'<input type="number" inputmode="numeric" min="1" id="e_'+key+'" value="'+val+'">'
   +'<span>'+unit+'</span></label>';};
 h+='<div class="note">Sets are tracked for every exercise. Switch on hold time and/or reps if this one needs them too.</div>';
 h+=fieldRow("hold","Hold time","sec");
 h+=fieldRow("reps","Reps","per set");
 h+=(mod.t==="ex")?fixedRow("sets","Sets",""):fieldRow("sets","Sets","");
 h+='<label class="checkline"><input type="checkbox" id="e_bs"'+(mod.bs?" checked":"")+'><b>Both sides</b><span>do it left and right; sets, reps and hold are per side</span></label>';
 h+='<div class="field"><label>Form cues (one per line)</label><textarea id="e_cues" rows="3">'+esc((mod.cues||[]).join("\n"))+'</textarea></div>';
 h+='<div class="field"><label>YouTube search phrase</label><input type="text" id="e_yt" value="'+esc(mod.yt||"")+'"></div>';
 h+='<button class="btn-primary" id="e_save">Save</button>';
 if(id&&S.lib.custom.some(c=>c.id===id))h+='<button class="btn-ghost btn-danger" style="color:#fff" id="e_del">Delete custom module</button>';
 showModal(h);
 /* each toggleable field is stored only while its checkbox is on; a field with no
    checkbox (sets, on exercises) is fixed on and always stored. Blank falls back
    to the default. */
 const fieldVal=key=>{
  const cb=$("#e_"+key+"_on");
  if(cb&&!cb.checked)return null;
  const el=$("#e_"+key);if(!el)return null;
  const v=(el.value||"").trim();
  const n=parseInt(v,10);
  return(!v||isNaN(n)||n<1)?FIELD_DEFAULTS[key]:n;};
 $("#modal").querySelectorAll("[data-fchk]").forEach(cb=>cb.onchange=()=>{
  const key=cb.getAttribute("data-fchk"),num=$("#e_"+key),row=cb.closest(".ftog");
  num.disabled=!cb.checked;
  row.classList.toggle("off",!cb.checked);
  if(cb.checked&&!(num.value||"").trim())num.value=FIELD_DEFAULTS[key];});
 $("#e_save").onclick=()=>{
  const data={name:$("#e_name").value.trim()||"Unnamed",t:$("#e_type").value,eq:$("#e_eq").value,
   m:$("#e_m").value,cues:$("#e_cues").value.split("\n").map(x=>x.trim()).filter(Boolean),
   yt:$("#e_yt").value.trim(),
   sets:fieldVal("sets"),reps:fieldVal("reps"),hold:fieldVal("hold"),
   bs:!!($("#e_bs")&&$("#e_bs").checked)};
  if(!id){data.id="cu_"+uid();S.lib.custom.push(data);}
  else{
   const ci=S.lib.custom.findIndex(c=>c.id===id);
   if(ci>=0)S.lib.custom[ci]=Object.assign({id:id},data);
   else S.lib.edits[id]=data;
  }
  save();closeModal();render();};
 const del=$("#e_del");
 if(del)del.onclick=()=>{if(confirm("Delete this module?")){S.lib.custom=S.lib.custom.filter(c=>c.id!==id);save();closeModal();render();}};
}

/* ===== Settings ===== */
function renderSettings(){
 let h="";
 h+='<h3 class="sec">Band difficulty order (easiest &rarr; hardest)</h3>';
 h+='<div class="note">Order bands easiest to hardest and tap Save order - "way too easy" then auto-suggests the next band up.</div>';
 h+='<div id="bandlist">';
 S.settings.bandOrder.forEach((c,i)=>{
  h+='<div class="bandrow"><span class="bn">'+(i+1)+'. '+esc(c)+'</span>';
  h+='<button data-bup="'+i+'">&#9650;</button><button data-bdn="'+i+'">&#9660;</button><button data-bx="'+i+'">&#10005;</button></div>';
 });
 h+='</div><div class="row"><input type="text" id="newband" placeholder="add band color" style="flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:15px">';
 h+='<button class="btn-sm" id="addband">Add</button></div>';
 h+='<button class="btn-primary" style="margin-top:10px" id="saveorder">Save order</button>';
 h+='<h3 class="sec">Today</h3>';
 h+='<button class="btn-sm" id="reroll">Re-roll today\'s list</button><div class="note">Generates a new random selection for today. Completed items stay logged.</div>';
 h+='<h3 class="sec">Backup</h3>';
 h+='<div class="note">iPhone can clear browser data. Back up regularly - it saves a small file you can restore from.</div>';
 h+='<div class="row"><button class="btn-sm" id="exportbtn">Export backup</button>';
 h+='<button class="btn-sm" id="importbtn">Restore from backup</button></div>';
 h+='<input type="file" id="importfile" accept=".json,application/json" style="display:none">';
 h+='<h3 class="sec">Danger zone</h3>';
 h+='<button class="btn-sm btn-danger" id="wipe">Erase all data</button>';
 $("#view").innerHTML=h;
 const reorder=()=>{save();renderSettings();};
 $("#view").querySelectorAll("[data-bup]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-bup");if(i>0){const o=S.settings.bandOrder;[o[i-1],o[i]]=[o[i],o[i-1]];reorder();}});
 $("#view").querySelectorAll("[data-bdn]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-bdn");const o=S.settings.bandOrder;if(i<o.length-1){[o[i+1],o[i]]=[o[i],o[i+1]];reorder();}});
 $("#view").querySelectorAll("[data-bx]").forEach(b=>b.onclick=()=>{S.settings.bandOrder.splice(+b.getAttribute("data-bx"),1);reorder();});
 $("#addband").onclick=()=>{const v=$("#newband").value.trim().toLowerCase();if(v&&!S.settings.bandOrder.includes(v)){S.settings.bandOrder.push(v);reorder();}};
 $("#saveorder").onclick=()=>{S.settings.bandOrderSet=true;save();renderSettings();};
 $("#reroll").onclick=()=>{if(confirm("Re-roll today's list?"))rerollToday();};
 $("#exportbtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="momstrong-backup-"+todayStr()+".json";a.click();};
 $("#importbtn").onclick=()=>$("#importfile").click();
 $("#importfile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);
   if(!s.logs||!s.settings)throw new Error("not a MOMstrong backup");
   S=s;save();alert("Restored!");render();}catch(err){alert("Restore failed: "+err.message);}};
  r.readAsText(f);};
 $("#wipe").onclick=()=>{if(confirm("Erase ALL logs and settings? Export a backup first!")&&confirm("Really erase everything?")){S=freshState();save();render();}};
}

/* ===== Nav, init ===== */
function render(){
 if(TAB==="today")renderToday();
 else if(TAB==="cal")renderCal();
 else if(TAB==="steps")renderSteps();
 else if(TAB==="stats")renderStats();
 else if(TAB==="library")renderLibrary();
 else renderSettings();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 TAB=b.getAttribute("data-tab");
 if(TAB==="library")LIB_M=null;
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
 stopTimer();render();window.scrollTo(0,0);});
render();
window.scrollTo(0,0);
</script>
</body>
